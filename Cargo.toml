[package]
name = "stella-scope"
version = "0.6.1"
edition = "2021"
rust-version = "1.91"
description = "Read-only Klipper recorder with rewind and bounded fault investigation"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
getrandom = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# WO-08 plate check: decode the camera's JPEG and PNG frames, nothing else (same selection as eye/).
# WO-09 farm licence: offline signature verification, the one crate the licence needs.
ed25519-dalek = { version = "2", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[features]
# Finish-2 F06 (2026-10-19): a build that checks farm licences against a throwaway TEST key instead of the shipped one, so the licence screens can be
# walked with a licence made by tools/farm-licence.rs and a key pair that was generated for the test. The 64-hex-digit public key is read from
# STELLA_TEST_LICENCE_PUBKEY when the program is BUILT (no variable, no build). Never in a shipped build: the shipped key is the constant in src/licence.rs.
test-licence-key = []

[[example]]
name = "fake-printers"
path = "tools/fake-printers.rs"

[[example]]
name = "farm-licence"
path = "tools/farm-licence.rs"

[[example]]
name = "plate-eval"
path = "tools/plate-eval.rs"

[[example]]
name = "printer-models-index"
path = "tools/printer-models-index.rs"
test = true

[[example]]
name = "printer-motion-parts"
path = "tools/printer-motion-parts.rs"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

[[example]]
name = "printer-print-frames"
path = "tools/printer-print-frames.rs"
