[package]
name = "stella-scope"
version = "0.4.2"
edition = "2021"
rust-version = "1.91"
description = "Read-only Klipper recorder with rewind and bounded fault investigation"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }
ureq = { version = "3.1", default-features = false }
getrandom = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
