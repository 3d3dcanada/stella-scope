[package]
name = "stella-desktop"
version = "0.4.2"
edition = "2021"
publish = false
description = "Stella Scope for the computer next to the printer: finds the printer, starts the recorder, the phone link and the failure watch, and shows Stella Scope."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
