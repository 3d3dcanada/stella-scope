<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Stella Scope</title>
<style>
 :root{--bg:#07090C;--glass:rgba(22,27,34,.72);--line:rgba(255,255,255,.09);--ink:#EEF2F6;--ink2:#A7B0BA;--ink3:#6E7883;--accent:#04D9C4;--ok:#18E36B;--alarm:#FF2D92}
 *{box-sizing:border-box}
 [hidden]{display:none!important}
 html,body{margin:0;height:100%;background:radial-gradient(100% 70% at 50% 0%,#0f2a2a 0%,var(--bg) 62%);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
 main{max-width:640px;margin:0 auto;padding:56px 24px;display:flex;flex-direction:column;gap:20px}
 header{display:flex;align-items:center;gap:14px}
 header b{font:700 24px/1 system-ui;letter-spacing:.32em}
 header small{display:block;color:var(--ink3);font:500 12px/1.3 ui-monospace,monospace;letter-spacing:.12em;margin-top:6px}
 .card{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 18px 50px rgba(0,0,0,.5)}
 h2{margin:0 0 6px;font:700 18px/1.3 system-ui}
 p{margin:6px 0;color:var(--ink2)}
 .row{display:flex;gap:10px;margin-top:12px}
 input{flex:1;min-height:48px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--ink);padding:0 14px;font:500 14px ui-monospace,monospace}
 button.btn{min-height:48px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font:650 14px system-ui;letter-spacing:.05em;padding:0 18px;cursor:pointer}
 button.primary{background:linear-gradient(180deg,#3FF3E0,var(--accent));color:#031A17;border-color:rgba(63,243,224,.6);box-shadow:0 0 26px rgba(4,217,196,.35)}
 .msg{min-height:1.4em;font-weight:600}.msg.err{color:var(--alarm)}.msg.ok{color:var(--ok)}
</style>
</head>
<body>
<main>
 <header><img src="logo.svg" width="44" height="44" alt=""><div><b>STELLA SCOPE</b><small>ONE STEP</small></div></header>
 <section class="card">
  <h2>Welcome</h2>
  <p>Open Stella Scope, then add your printers there with Add a printer. Any brand, any number. You can also try the demo farm first.</p>
  <div class="row"><button class="btn primary" id="go">Open Stella Scope</button></div>
  <p id="msg" class="msg"></p>
 </section>
 <p>Your printers' data stays on this computer. Your phone pairs with this computer directly, by scanning a code; there is no account.</p>
</main>
<script>
const invoke=window.__TAURI__.core.invoke,$=id=>document.getElementById(id);
async function go(cmd){$('go').disabled=true;$('msg').className='msg';$('msg').textContent='Starting Stella Scope…';
 try{location.href=await invoke(cmd);}
 catch(e){$('go').disabled=false;$('go').textContent='Try again';$('msg').className='msg err';$('msg').textContent=String(e);}}
$('go').onclick=()=>go('create_and_start');
(async()=>{const st=await invoke('setup_state');
 // A Stella Scope already running on this computer (a service, or another window) opens as it is.
 if(st.running){location.href=st.url;return;}
 if(st.configured)go('start');})();
</script>
</body>
</html>
