<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07090C">
<title>Stella Scope · pair this device</title>
<link rel="stylesheet" href="/next.css">
<script type="module" src="/pair.js"></script>
</head>
<body class="nx-pair-page">
<main class="nx-pair nx-glass nx-glass--raised">
 <img src="/logo.svg" alt="" class="nx-pair-logo">
 <h1>Pair this device</h1>
 <p>On the computer running Stella Scope, open <b>Phone &amp; WhatsApp</b> and press <b>Pair a phone</b>. Type the six digits it shows.</p>
 <input id="code" class="nx-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" aria-label="Six-digit code">
 <button id="go" class="nx-btn" data-kind="primary" data-size="row" type="button"><span class="nx-lbl">Pair</span></button>
 <p id="msg" class="nx-note" role="status"></p>
</main>
</body>
</html>
